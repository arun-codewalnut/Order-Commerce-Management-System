# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:commercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# External services mock endpoints for tests
external.payment.url=http://localhost:8080/mock-payment
external.notification.url=http://localhost:8080/mock-notification
app.order.discount-threshold=100.0
app.order.tax-rate=0.08
app.shipping.flat-rate=15.5
app.payment.mock-provider-name=FastPayMock
