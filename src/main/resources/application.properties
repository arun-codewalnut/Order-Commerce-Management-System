server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bad_commerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate (Intentionally un-migrated, auto-updating, OSIV enabled)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator (Intentionally exposed fully)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Scattered application configs
external.payment.url=http://localhost:8080/mock-payment
external.notification.url=http://localhost:8080/mock-notification
app.order.discount-threshold=100.0
app.order.tax-rate=0.08
app.shipping.flat-rate=15.5
app.payment.mock-provider-name=FastPayMock

